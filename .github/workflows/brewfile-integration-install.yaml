name: Brewfile Integration Install

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  integration-install:
    name: Integration Install
    runs-on: macos-latest
    timeout-minutes: 10
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_ANALYTICS: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@master
      - name: Show Homebrew version
        run: brew --version
      - name: Print Brewfile
        run: |
          echo "=== Brewfile Preview ==="
          cat Brewfile.*
          echo "================================"
      - name: Install Brewfiles
        run: |
          echo "Starting Brewfile installation tests..."
          cat Brewfile.* | brew bundle --file=-
          echo "All Brewfiles have been installed."
