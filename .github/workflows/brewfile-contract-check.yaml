name: Brewfile Contract Check

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  contract-check:
    name: Contract Check
    runs-on: macos-latest
    timeout-minutes: 5
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_ANALYTICS: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Show Homebrew version
        run: brew --version
      - name: Install Brewfiles
        run: |
          echo "Starting Brewfile installation tests..."
          for file in Brewfile Brewfile.*; do
            if [ -f "$file" ]; then
              echo "----------------------------------------"
              echo "Installing packages from: $file"
              brew bundle install --no-upgrade --file="$file"
              echo "Successfully installed all packages from $file."
            fi
          done
          echo "----------------------------------------"
          echo "All Brewfiles have been installed."
